name: hermess-metrics
version: "0.1.0"
description: "Ships Hermes agent-loop telemetry to Axiom as OpenTelemetry traces, metrics, and logs. Opt in with `hermes plugins enable hermess-metrics`; HERMES_AXIOM_* env vars select the deployment and datasets."
author: Heinz Gies
kind: standalone
requires_env:
  - HERMES_AXIOM_TOKEN
provides_hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - pre_llm_call
  - post_llm_call
  - post_api_request
  - api_request_error
  - post_tool_call
  - pre_approval_request
  - post_approval_response
provides_tools: []
